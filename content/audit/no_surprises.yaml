schema_version: 1
id: no_surprises
title: No Surprises
estimated_minutes: 44
day_dates:
  day_1: 2028-02-01
  day_2: 2028-02-02
  day_3: 2028-02-03
  day_4: 2028-02-04
engagement_objective: >-
  Determine whether the Eleventh Contract authorization, execution,
  confirmation, physical support, exception handling, and reconciliation can
  be reconstructed from preserved records, and whether the related controls
  were designed and operated to produce a timely, accurate result.
scope_inclusions:
  - The Eleventh Contract transaction and its physical-volume support
  - Authorization, order, execution, confirmation, position, margin, and reconciliation
  - Exception escalation, corrective approval, offset, communications, and preserved records
scope_exclusions:
  - Legal conclusions or regulatory enforcement
  - A company-wide control opinion
  - Transactions outside the selected Eleventh Contract
simplifying_assumptions:
  - Northstar's Advisory, Moderate, High, and Critical labels are fictional internal ratings.
  - The walkthrough tests one selected transaction and does not establish company-wide failure rates.
  - Noah evaluates records available to internal audit; he does not know hidden game state.
  - NFA and CFTC references are educational and are not asserted to govern every Northstar employee.
