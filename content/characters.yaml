people:
  - id: player
    name: Player
    role: Northstar analyst
    origin: Chosen by the player
    public_detail: The newest analyst assigned to Northstar's commodity-risk rotation.
    interaction_reason: This record is replaced by the player's chosen name and background.
  - id: evelyn_marsh
    name: Evelyn Marsh
    role: Controller
    origin: Milwaukee, Wisconsin
    public_detail: Carries a mechanical pencil and asks which record existed before anyone knew the result.
    interaction_reason: She owns the close and supervises the records the player is being trained to prepare.
  - id: cal_rourke
    name: Cal Rourke
    role: Commercial director
    origin: Appleton → Milwaukee
    public_detail: Learned industrial gas demand around Fox Valley paper mills and dislikes qualifiers in forecasts.
    interaction_reason: His desk turns weather, pipeline information, and sales expectations into hedge recommendations.
  - id: marisol_vega
    name: Marisol Vega
    role: Gas scheduling manager
    origin: Racine → Milwaukee
    public_detail: Runs three phones, one transportation map, and no patience for gas that exists only in a spreadsheet.
    interaction_reason: Her scheduling records determine whether the player's commercial assumptions have physical support.
  - id: tj_morrow
    name: Travis “T.J.” Morrow
    role: Gulf Coast market analyst
    origin: Houston, Texas → Northstar commercial desk
    public_detail: Treats hurricane preparation and gas nominations as work completed before the weather arrives.
    interaction_reason: He joins the rotation call to separate Henry Hub exposure from Chicago regional basis.
  - id: kasia_zielinska
    name: Katarzyna “Kasia” Zielińska
    role: Risk systems analyst
    origin: Gdańsk, Poland → Chicago → Milwaukee
    public_detail: Maintains the position system Cal insists he understands perfectly.
    interaction_reason: She checks whether contract quantities, physical support, and system records agree.
  - id: darren_cho
    name: Darren Cho
    role: Lakefront FCM margin representative
    origin: Morton Grove, Illinois → Chicago
    public_detail: Delivers urgent margin numbers in the same even tone he uses for commuter-rail delays.
    interaction_reason: He is the player's external contact for settlement balances and same-day margin calls.
  - id: june_halvorsen
    name: June Halvorsen
    role: Northstar treasury director
    origin: Marquette, Michigan → Milwaukee
    public_detail: Measures bad days by when the cash is due, not by how dramatic the forecast sounds.
    interaction_reason: She decides how Northstar protects operating obligations when hedge cash moves early.
  - id: vince_rourke
    name: Vince Bellandi
    role: Northstar executive
    origin: Kenosha → Milwaukee
    public_detail: Can make a disputed number sound like a family favor before the conference-room door closes.
    interaction_reason: He wants the player to resolve the December discrepancy without delaying the close.
  - id: dom_bellini
    name: Dom Bellini
    role: Commercial counterparty
    origin: Milwaukee's South Side
    public_detail: Remembers confirmation numbers, supper reservations, and who was omitted from both.
    interaction_reason: His supply relationship with Northstar reaches the player's records and Friday fish fry.
  - id: noah_shah
    name: Noah Shah
    role: Internal audit manager
    origin: Detroit → Milwaukee
    public_detail: Began in automotive-supplier controls and distrusts timelines reconstructed from memory.
    interaction_reason: He asks the player to walk one transaction from authorization through correction.
  - id: sofia_marin
    name: Sofia Marin
    role: Great Lakes Infrastructure Partners VP of Commercial Diligence
    origin: Cleveland → Chicago
    public_detail: Reads a data-room index as closely as other people read a term sheet.
    interaction_reason: She tests whether Northstar's commercial story survives contact with its source records.
  - id: ingrid_holtz
    name: Ingrid Holtz
    role: Independent director and audit-committee representative
    origin: Green Bay → Milwaukee
    public_detail: Speaks sparingly and takes careful notes whenever management says an issue is already closed.
    interaction_reason: She needs a board-level account of the transaction, controls, and remediation status.
  - id: mara_voss
    name: Mara Voss
    role: Great Lakes Commercial Bank relationship manager
    origin: Toledo → Chicago
    public_detail: Knows which covenant questions become expensive when answered late.
    interaction_reason: She reviews the liquidity bridge and revolver implications for Northstar's lender.
