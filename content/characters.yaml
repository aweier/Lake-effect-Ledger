schema_version: 1
background_selection:
  introduction: >-
    Accounting, Finance, and Data Analytics are prior educational or early-career
    perspectives. All three enter the same Junior Commodity Risk Analyst rotation
    and complete the same work.
  question: What training did you bring to Northstar?
  equivalence_note: >-
    There is no best background. Your choice changes the perspective and support
    used to introduce concepts—not the correct answers or available story paths.
  first_rotation_context: >-
    “Commodity work never stays on one desk,” Evelyn says. “It crosses accounting,
    markets, operations, treasury, and data systems. This rotation teaches every
    junior analyst to follow the same transaction across all five.”
  notebook_note: >-
    Your starting background changes early framing only. Familiarity is not
    demonstrated mastery; your answers establish learning progress.
backgrounds:
  - id: accounting
    label: Accounting
    description: >-
      You know how business activity reaches the ledger. Now you need to learn
      what happens before the entry is posted.
    prior_experience: >-
      Coursework, internships, or junior work with journal entries,
      reconciliations, month-end close, and financial statements.
    starting_strength: >-
      You understand how an operating event becomes an accounting record and
      eventually affects financial reporting.
    learning_edge: >-
      Futures terminology, basis behavior, hedge construction, and daily margin
      cash movement may initially feel unfamiliar.
    hiring_reason: >-
      Northstar needs someone who can connect trades and physical gas activity to
      reliable books and records.
    first_rotation_acknowledgment: >-
      The ledger structure is familiar: source documents, entries,
      reconciliations, and reporting. Evelyn notices where you slow down. “You can
      follow what reaches the books. Futures language and the cash timing behind
      it are what we’ll build next.”
    teaching_frame: >-
      As futures and basis appear, work from ledger to market: identify the
      exposure and physical event that the eventual entry must represent.
    skills:
      accounting: 8
      markets: 4
      analytics: 5
    personal_cash: 2600
    resource_adjustments: {}

  - id: finance
    label: Finance
    description: >-
      You can see the exposure and the financial consequence. Now you need to
      prove how the number entered the system.
    prior_experience: >-
      Coursework or junior work with markets, valuation, corporate finance, cash
      forecasting, or investment analysis.
    starting_strength: >-
      You think comfortably about price exposure, hedge economics, P&L,
      liquidity, and financial tradeoffs.
    learning_edge: >-
      Documentation, journal-entry mechanics, evidence standards, and operational
      controls may initially feel procedural or restrictive.
    hiring_reason: >-
      Northstar needs someone who can understand why the company hedges and
      explain the economic effect of a market move.
    first_rotation_acknowledgment: >-
      You understand why a seller might hedge and what a price move could do.
      Evelyn stops you when economic intent starts to sound sufficient. “The
      objective matters, but the record, evidence, and controls are part of the
      work too.”
    teaching_frame: >-
      As records and reconciliations appear, work from exposure to evidence:
      connect each economic claim to its entry, support, and control.
    skills:
      accounting: 5
      markets: 8
      analytics: 4
    personal_cash: 2600
    resource_adjustments: {}

  - id: data_analytics
    label: Data analytics
    description: >-
      You notice when the numbers disagree. Now you need to learn what each
      number represents and what should happen next.
    prior_experience: >-
      Coursework or junior work with spreadsheets, SQL, reporting systems,
      reconciliations, anomaly detection, or data visualization.
    starting_strength: >-
      You notice mismatched quantities, broken links, unusual changes, and
      differences between systems.
    learning_edge: >-
      Formal accounting treatment, futures-market conventions, and the commercial
      meaning behind the data may initially require explanation.
    hiring_reason: >-
      Northstar needs someone who can reconcile physical gas, futures positions,
      confirmations, settlements, and accounting records across systems.
    first_rotation_acknowledgment: >-
      You spot the mismatch before anyone finishes explaining the report. Evelyn
      asks what the discrepancy means. “Seeing it is the start. We’ll connect it
      to the contract, commercial exposure, and accounting record.”
    teaching_frame: >-
      As contracts and accounting appear, work from system to business: trace
      each number to the event, obligation, and record it is meant to represent.
    skills:
      accounting: 4
      markets: 5
      analytics: 8
    personal_cash: 2600
    resource_adjustments: {}

people:
  - id: player
    name: Player
    role: Junior Commodity Risk Analyst
    origin: Player-selected
    public_detail: The newest junior analyst assigned to Northstar's commodity-risk rotation.
    interaction_reason: This record is replaced by the player's chosen name and background.
  - id: evelyn_marsh
    name: Evelyn Marsh
    role: Controller
    origin: Milwaukee, Wisconsin
    public_detail: Repairs mechanical clocks on winter weekends and asks which record existed before anyone knew the result.
    interaction_reason: She owns the close and supervises the records the player is being trained to prepare.
  - id: cal_rourke
    name: Cal Rourke
    role: Commercial Director and Hedging Supervisor
    origin: Appleton → Milwaukee
    public_detail: Learned industrial gas demand around Fox Valley paper mills and still treats a hockey shift like a negotiation.
    interaction_reason: He owns commercial forecasts and supervised hedge recommendations, but not accounting or treasury conclusions.
  - id: marisol_vega
    name: Marisol Vega
    role: Gas Scheduling Manager
    origin: Racine → Milwaukee
    public_detail: Runs three phones, one transportation map, and the family calendar that survives everyone else's shift changes.
    interaction_reason: Her scheduling records determine whether the player's commercial assumptions have physical support.
  - id: tj_morrow
    name: Travis “T.J.” Morrow
    role: Gulf Coast Market Analyst
    origin: Pasadena → Houston, Texas
    public_detail: Keeps storm supplies for three households and treats gas nominations as work completed before weather arrives.
    interaction_reason: He joins the rotation call to separate Henry Hub exposure from Chicago regional basis.
  - id: kasia_zielinska
    name: Katarzyna “Kasia” Zielińska
    role: Risk Systems Analyst
    origin: Gdańsk, Poland → Chicago → Milwaukee
    public_detail: Rows on Saturday mornings and maintains the position system Cal insists he understands perfectly.
    interaction_reason: She checks whether contract quantities, physical support, and system records agree.
  - id: darren_cho
    name: Darren Cho
    role: FCM Margin Representative
    origin: Morton Grove, Illinois → Chicago
    public_detail: Carries a paperback for commuter delays and delivers urgent margin numbers in the same even tone.
    interaction_reason: He is the player's external Lakefront FCM contact for settlement balances and same-day margin calls.
  - id: june_halvorsen
    name: June Halvorsen
    role: Treasury Director
    origin: Marquette, Michigan → Milwaukee
    public_detail: Restores an old family canoe and measures bad days by when cash is due, not by forecast drama.
    interaction_reason: She decides how Northstar protects operating obligations when hedge cash moves early.
  - id: vince_rourke
    name: Vince Bellandi
    role: EVP, Operations
    origin: Kenosha → Milwaukee
    public_detail: Checks on his mother and a half-restored yard tow truck every Sunday, then carries both worries into Monday.
    interaction_reason: Dom's nephew wants the player to resolve the December discrepancy without delaying operations or the close.
    legacy_id_note: >-
      Legacy internal ID retained for save compatibility. Vince is a Bellandi,
      Dom’s nephew, and is not related to Cal Rourke.
    family_relationships:
      dom_bellini: uncle
  - id: dom_bellini
    name: Dominic “Dom” Bellandi
    role: Founder and Chairman
    origin: Milwaukee's South Side
    public_detail: Hosts Friday fish fry, watches who needs a refill, and remembers personal details long after introductions.
    interaction_reason: Northstar's founder, chairman, and Vince's uncle is deciding how much discretion and trust the player deserves.
    legacy_id_note: Legacy internal ID retained for save compatibility. Display surname is Bellandi.
    family_relationships:
      vince_rourke: nephew
  - id: noah_shah
    name: Noah Shah
    role: Internal Audit Manager
    origin: Detroit → Milwaukee
    public_detail: Keeps a standing Detroit basketball date and distrusts business timelines reconstructed from memory.
    interaction_reason: He asks the player to walk one transaction from authorization through correction.
  - id: sofia_marin
    name: Sofia Marin
    role: VP, Commercial Diligence
    origin: Cleveland → Chicago
    public_detail: Collects old Great Lakes industrial postcards and reads an upload index as closely as a term sheet.
    interaction_reason: She represents Great Lakes Infrastructure Partners and tests whether Northstar can survive ownership change.
  - id: ingrid_holtz
    name: Ingrid Holtz
    role: Independent Director
    origin: Green Bay → Milwaukee
    public_detail: Chairs a neighborhood library foundation and takes careful notes whenever management says an issue is closed.
    interaction_reason: She represents independent board oversight of the transaction, controls, and remediation status.
  - id: mara_voss
    name: Mara Voss
    role: Commercial Banking Relationship Manager
    origin: Toledo → Chicago
    public_detail: Follows Toledo baseball and knows which covenant questions become expensive when answered late.
    interaction_reason: She represents Great Lakes Commercial Bank and reviews Northstar's liquidity bridge and revolver.
