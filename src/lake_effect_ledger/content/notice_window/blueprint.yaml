        - {id: physical_supplier, text: "The physical supplier automatically clears every futures trade."}
        - {id: no_intermediary, text: "The hedger necessarily trades directly as a clearing member."}
      correct_option_id: fcm_relationship
    - id: nwr_remediate_calendar
