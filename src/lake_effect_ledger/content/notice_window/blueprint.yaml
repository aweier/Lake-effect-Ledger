      objectives: [delivery, records_and_ethical_conduct]
      source_id: cme_rule_538
      options:
        - {id: both_legs, text: "Records of the futures leg and the corresponding bona fide physical or forward leg."}
        - {id: futures_only, text: "Only an internal futures ticket labeled EFP."}
        - {id: intent_only, text: "A later statement that delivery was inconvenient."}
      correct_option_id: both_legs
    - id: nwr_offset_chain
      check_type: multiple_choice
      category: conceptual
      remediation_category: resolution_records
      prompt: After an authorized offset brings the position to zero, what should reconciliation preserve?
      objectives: [offset_preserves_history, trade_lifecycle, records_and_ethical_conduct]
      source_id: cme_closing_position
      options:
        - {id: complete_chain, text: "The original position, offset authorization, execution, confirmation, and zero-position reconciliation."}
        - {id: zero_only, text: "Only a screenshot showing zero contracts."}
        - {id: delete_original, text: "Delete the original trade because no position remains."}
      correct_option_id: complete_chain
