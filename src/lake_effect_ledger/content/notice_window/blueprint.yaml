        - {id: automatic_fill, text: "Every order automatically fills at the limit."}
        - {id: exposure_ends, text: "The open futures exposure ends automatically."}
      correct_option_id: orders_may_not_fill
    - id: nwr_efp_records
      check_type: multiple_choice
      category: conceptual
      remediation_category: resolution_records
