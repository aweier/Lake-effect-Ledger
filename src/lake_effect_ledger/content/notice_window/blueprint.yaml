        - {id: exchange_rule, text: "The internal deadline becomes the exchange's last trading day."}
        - {id: removes_delivery, text: "An internal deadline removes delivery provisions from the contract."}
      correct_option_id: operational_buffer
    - id: nwr_remediate_curve
