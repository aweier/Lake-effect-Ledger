schema_version: 1
lessons:
  - id: double_entry
    category: accounting
    title: Balanced journal entries
    explanation: >-
      Every posted transaction needs equal debits and credits. Balance is
      necessary, but it does not prove that the classification or estimate is
      supported.

  - id: classification_support
    category: controls
    title: Classification requires support
    explanation: >-
      Calling an unresolved meter difference “line loss” is an accounting
      conclusion. A familiar label does not replace meter, contract, and
      allocation evidence.

  - id: provisional_recognition
    category: accounting
    title: Provisional imbalance recognition
    explanation: >-
      A provisional asset and payable can preserve an unresolved item on the
      balance sheet without pretending the final ownership analysis is done.
      The estimate still needs review and timely resolution.

  - id: reconciliation_evidence
    category: controls
    title: Reconciliation evidence
    explanation: >-
      A useful reconciliation identifies the source records, explains the
      difference, documents review, and leaves a trace another reviewer can
      reproduce.

  - id: escalation_and_review
    category: controls
    title: Escalation and independent review
    explanation: >-
      Unsupported entries should reach someone with authority and enough
      independence to challenge both the accounting and the operational story.

  - id: gas_imbalance
    category: natural_gas
    title: Gas imbalances
    explanation: >-
      Metered, scheduled, allocated, and settled volumes can differ. The
      difference must be tracked until contract terms and operational records
      establish who owes gas or money.

  - id: physical_financial_exposure
    category: series_3
    title: Physical versus financial exposure
    explanation: >-
      A forecast Chicago sale is economically long physical gas: its expected
      value falls when the regional price falls. A short Henry Hub futures
      position can offset Henry Hub price movement without changing the
      underlying physical commitment.

  - id: short_futures_hedge
    category: series_3
    title: Short futures hedge
    explanation: >-
      A producer or seller exposed to falling prices can sell futures. A short
      position gains when the futures settlement falls and loses when it rises.

  - id: long_futures_hedge
    category: series_3
    title: Long futures hedge
    explanation: >-
      A buyer exposed to rising prices can buy futures. A long position gains
      when the futures settlement rises, helping offset a higher later purchase
      price. Northstar's forecast sale uses the opposite, short-hedge direction.

  - id: hedge_ratio
    category: series_3
    title: Hedge ratio and speculative excess
    explanation: >-
      The hedge ratio compares futures quantity with physical quantity. Above
      100%, the excess futures quantity is not offset by the stated physical
      exposure and remains speculative even if it later makes money.

  - id: daily_settlement_margin
    category: series_3
    title: Daily settlement and margin
    explanation: >-
      Futures are marked to settlement each day. Gains add to FCM margin cash;
      losses reduce it. A balance below maintenance creates a call to restore
      the configured initial-margin amount.

  - id: basis_risk
    category: series_3
    title: Regional basis risk
    explanation: >-
      Chicago price equals Henry Hub plus Chicago basis in this scenario. A
      Henry Hub futures hedge offsets Henry Hub movement but leaves changes in
      the Chicago differential unhedged.

  - id: economic_cash_accounting
    category: accounting
    title: Economic value, cash, and ledger recognition
    explanation: >-
      The forecast physical sale is marked economically for management
      analysis but is not booked in this simplified ledger. Futures settlement
      changes recognized income and FCM cash; margin transfers only move cash
      between operating and restricted accounts.

  - id: hedge_documentation
    category: controls
    title: Contemporaneous hedge documentation
    explanation: >-
      A rationale should identify the physical exposure, futures quantity,
      intended risk reduction, remaining basis risk, and approval. Later gains
      do not repair vague authorization or convert speculative excess into a
      documented hedge.

  - id: liquidity_not_profit
    category: accounting
    title: Liquidity is not profitability
    explanation: >-
      An economically successful physical-and-futures position can still fail
      a same-day cash obligation. Timing and location of cash matter separately
      from total economic P&L.

  - id: revolver_mechanics
    category: accounting
    title: Revolver capacity and debt
    explanation: >-
      A revolver draw increases operating cash and a debt liability. Drawing
      does not create revenue, and interest continues to accrue while principal
      remains outstanding.

  - id: obligation_priority
    category: controls
    title: Protect scheduled obligations
    explanation: >-
      Treasury decisions should reserve cash for payroll, pipeline, supply, and
      other due obligations before treating the bank balance as freely
      available.

  - id: treasury_communication
    category: controls
    title: Timely, accurate treasury communication
    explanation: >-
      A useful escalation identifies the call, deadline, requested action,
      recipients, and approval. A timestamped record supports later review
      without itself deciding whether anyone acted improperly.

  - id: order_types
    category: series_3
    title: Market, limit, and stop orders
    explanation: >-
      Market orders prioritize execution, limit orders constrain eligible
      prices, and stop orders activate only after a trigger. Trigger and fill
      prices can differ.

  - id: trade_lifecycle
    category: controls
    title: Recommendation through confirmation
    explanation: >-
      A recommendation, authorization, submitted order, execution, FCM
      confirmation, and reconciliation are separate records with different
      owners and control purposes.

  - id: trade_reconciliation
    category: controls
    title: Trade blotter reconciliation
    explanation: >-
      Internal orders and authorizations must be compared with executions and
      external confirmations. Exceptions remain explicit until supported,
      escalated, corrected, or certified with exception.

  - id: offset_preserves_history
    category: series_3
    title: Offsetting positions preserve history
    explanation: >-
      An offsetting trade changes future open exposure. It does not delete the
      original execution or previously settled variation margin.

  - id: authorization_vs_outcome
    category: controls
    title: Authorization is not hindsight
    explanation: >-
      A profitable trade or later physical support does not retroactively
      enlarge a contemporaneous approval. Economic result and supervisory
      authorization answer different questions.

  - id: records_and_ethical_conduct
    category: series_3
    title: Introductory records and ethical conduct
    explanation: >-
      Accurate, time-linked records support supervision and fair dealing.
      A later profit, explanation, or correction does not justify changing the
      original authorization, order, execution, or confirmation history.

  - id: preventive_detective_controls
    category: controls
    title: Preventive and detective controls
    explanation: >-
      A preventive control is designed to stop or constrain an error before
      it occurs. A detective control identifies an event after or as it
      occurs so that it can be escalated and corrected.

  - id: authorization_reconciliation_roles
    category: controls
    title: Authorization and reconciliation serve different purposes
    explanation: >-
      Authorization defines what may happen before execution. Reconciliation
      compares what actually happened with approvals and external evidence;
      a later match cannot create missing prior authority.

  - id: design_operating_effectiveness
    category: controls
    title: Control design and operation
    explanation: >-
      Design effectiveness asks whether a control, if performed as intended,
      can address its objective. Operating effectiveness asks whether the
      designed control was performed consistently, by the right person, and
      with reliable evidence.

  - id: contemporaneous_evidence
    category: controls
    title: Contemporaneous and later-created evidence
    explanation: >-
      Contemporaneous evidence records what was known and done at the time.
      Later evidence can resolve uncertainty or document remediation, but it
      should not be presented as if it existed earlier.

  - id: segregation_of_duties
    category: controls
    title: Segregation of duties
    explanation: >-
      Separating incompatible responsibilities reduces the chance that one
      person can initiate, approve, record, and conceal an error. Small teams
      may use documented independent review as a compensating control.

  - id: remediation_preserves_history
    category: controls
    title: Remediation does not rewrite history
    explanation: >-
      Corrective action changes present exposure or future process. It does
      not erase an original authorization breach, late escalation, or the
      records used to reconstruct the event.

  - id: economic_pnl_vs_margin_liquidity
    category: series_3
    title: Economic P&L and variation-margin liquidity
    explanation: >-
      A physical exposure and futures position can offset economically while
      daily variation settlement creates an immediate cash need. Diligence
      should reconcile economic effect and cash location separately.

  - id: supported_vs_forecast_volume
    category: controls
    title: Supported, possible, and later-supported volume
    explanation: >-
      A forecast can contain supported and possible volume. Later support
      updates the later exposure view but does not change what was documented,
      known, or authorized at an earlier date.

  - id: covenant_headroom
    category: accounting
    title: Covenant headroom
    explanation: >-
      Headroom is the amount by which the contract-defined measure exceeds its
      required minimum. Northstar's available-liquidity definition and threshold
      are fictional facility terms, not a universal banking formula.

  - id: scenario_vs_forecast
    category: accounting
    title: Sensitivity analysis is not a forecast
    explanation: >-
      A sensitivity applies disclosed what-if assumptions without assigning
      probabilities. It supports risk discussion but does not predict a result,
      change actual state, or create an accounting entry.

  - id: remediation_status_evidence
    category: controls
    title: Planned, implemented, tested, and closed remediation
    explanation: >-
      Approval supports a plan. Implementation requires evidence that the new
      activity exists. Testing evaluates whether it works, and closure requires
      the applicable owner and assurance process to accept that evidence.

  - id: qualitative_significance
    category: accounting
    title: Quantitative and qualitative significance
    explanation: >-
      Amount is one input. Authorization, management behavior, inaccurate
      certification, recurrence, liquidity, and record credibility can make a
      small-dollar issue important. A fictional review threshold is not an
      accounting-materiality or legal conclusion.

  - id: stakeholder_consistent_disclosure
    category: controls
    title: Consistent facts for different stakeholders
    explanation: >-
      Buyers, lenders, and boards may need different detail and emphasis.
      Shared facts should still reconcile to the same dated source records, and
      later corrections should preserve what each audience received earlier.

  - id: clearinghouse_mechanics
    category: series_3
    title: Clearing and counterparty structure
    explanation: >-
      A futures clearing house becomes the buyer to each clearing seller and
      the seller to each clearing buyer. A forward remains a private bilateral
      obligation unless a separate clearing arrangement changes that structure.

  - id: delivery
    category: series_3
    title: Physically delivered futures obligations
    explanation: >-
      An open physically delivered contract can enter the exchange delivery
      process after trading terminates. Delivery quantity, timing, location,
      notices, and final settlement follow the contract rules.

  - id: first_notice_day
    category: series_3
    title: Notice and expiration calendar
    explanation: >-
      Notice-related dates and the last trading day are separate contract-calendar
      controls. A firm should verify the current rulebook rather than infer them
      from a contract-month label or an internal deadline.

  - id: spot_month
    category: series_3
    title: Spot-month exposure
    explanation: >-
      The nearby contract becomes operationally sensitive as expiration and
      possible delivery approach. Internal action deadlines can be earlier than
      exchange dates without replacing the exchange calendar.

  - id: price_and_lock_limits
    category: series_3
    title: Price limits and locked markets
    explanation: >-
      A price limit constrains permitted trading prices under applicable rules.
      At a locked limit, resting orders are not guaranteed fills; exposure,
      variation settlement, and liquidity pressure can remain.

  - id: normal_inverted_markets
    category: series_3
    title: Normal and inverted futures curves
    explanation: >-
      Deferred minus nearby is positive in a normal or contango curve and
      negative in an inverted or backwardated curve. The signed spread states
      the shape without proving why the market has that shape.

  - id: carrying_charges
    category: series_3
    title: Carry and curve interpretation
    explanation: >-
      Storage, financing, insurance, and related costs can contribute to a
      deferred premium. Comparing the observed spread with an authored carry
      estimate is an interpretation aid, not proof of full carry.
