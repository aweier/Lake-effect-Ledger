schema_version: 1
sources:
  - id: cme_ng_contract
    organization: CME Group
    title: NYMEX Rulebook Chapter 220 — Henry Hub Natural Gas Futures
    url: https://www.cmegroup.com/rulebook/NYMEX/2/220.pdf
    note: Primary contract specification for Henry Hub Natural Gas futures.
  - id: cme_ng_overview
    organization: CME Group
    title: Natural Gas Product Overview
    url: https://www.cmegroup.com/education/courses/introduction-to-natural-gas/nat-gas-product-overview.html
    note: Product overview supporting the standard contract size and minimum tick.
  - id: cftc_glossary
    organization: Commodity Futures Trading Commission
    title: CFTC Glossary
    url: https://www.cftc.gov/LearnAndProtect/AdvisoriesAndArticles/CFTCGlossary/index.htm
    note: Definitions for futures, hedging, basis, margin, positions, and speculation.
  - id: cftc_economic_purpose
    organization: Commodity Futures Trading Commission
    title: The Economic Purpose of Futures Markets
    url: https://www.cftc.gov/LearnAndProtect/AdvisoriesAndArticles/economicpurpose.html
    note: Overview of price-risk transfer, daily settlement, margin, and market roles.
  - id: cftc_market_basics
    organization: Commodity Futures Trading Commission
    title: Futures Market Basics
    url: https://www.cftc.gov/LearnAndProtect/EducationCenter/FuturesMarketBasics/index2.htm
    note: Public educational overview of hedgers, speculators, and market oversight.
  - id: nfa_series3_outline
    organization: National Futures Association
    title: Series 3 — National Commodities Futures Examination Study Outline
    url: https://www.nfa.futures.org/registration-membership/study-outlines/index.html
    note: Reviewed August 27, 2026; authoritative topic map for the frozen Core classifications, Applied evidence overlay, and explicit future-coverage list.
  - id: cme_order_types
    organization: CME Group
    title: Futures Order Types
    url: https://www.cmegroup.com/education/courses/futures-trading-mechanics-and-regulation/futures-order-types
    note: Primary exchange education on market, limit, stop, and related order mechanics.
  - id: cme_order_lifecycle
    organization: CME Group
    title: What happens when you submit an order?
    url: https://www.cmegroup.com/education/courses/futures-trading-mechanics-and-regulation/what-happens-when-you-submit-an-order
    note: Exchange education on broker verification, exchange acceptance, matching, fills, and clearing.
  - id: cme_closing_position
    organization: CME Group
    title: Closing Your Position
    url: https://www.cmegroup.com/education/courses/things-to-know-before-trading-cme-futures/closing-your-position
    note: Exchange education on using an opposite trade to close an open futures position.
  - id: cme_curve_structure
    organization: CME Group
    title: What Is Contango and Backwardation?
    url: https://www.cmegroup.com/education/courses/introduction-to-ferrous-metals/what-is-contango-and-backwardation
    note: >-
      Exchange education supporting normal/contango and inverted/backwardation
      curve terminology. The Notice Window uses fictional natural-gas prices.
  - id: cme_rule_538
    organization: CME Group
    title: NYMEX Rulebook Chapter 5 — Rule 538 Exchange for Related Positions
    url: https://www.cmegroup.com/rulebook/NYMEX/1/5.pdf
    note: >-
      Primary exchange rule supporting the EFRP and EFP distinctions. The
      fictional Northstar workflow is not presented as an exchange requirement.
  - id: cftc_trade_records
    organization: Electronic Code of Federal Regulations
    title: 17 CFR 1.35 — Records of commodity interest transactions
    url: https://www.ecfr.gov/current/title-17/chapter-I/part-1/section-1.35
    note: Current federal recordkeeping requirements supporting distinct, durable trade records.
  - id: cftc_fcm_records
    organization: Commodity Futures Trading Commission
    title: Futures Commission Merchants (FCMs)
    url: https://www.cftc.gov/IndustryOversight/Intermediaries/FCMs/fcmibdisclosures.html
    note: CFTC summary of trading authorization, confirmations, order timestamps, transaction records, and supervision.
  - id: iia_global_standards
    organization: The Institute of Internal Auditors
    title: 2024 Global Internal Audit Standards
    url: https://www.theiia.org/globalassets/site/standards/globalinternalauditstandards_2024january9.pdf
    note: >-
      Primary professional source for evidence-based internal-audit
      engagement work, professional skepticism, communication, and monitoring
      action plans; effective for quality assessments January 9, 2025.
  - id: gao_green_book_2025
    organization: U.S. Government Accountability Office
    title: Standards for Internal Control in the Federal Government — 2025 Revision
    url: https://www.gao.gov/greenbook
    note: >-
      Primary federal internal-control framework used here only for accurate
      control-design, operation, preventive, and detective concepts; it does
      not govern fictional Northstar.
  - id: nfa_supervision_rule
    organization: National Futures Association
    title: NFA Rulebook — Compliance Rule 2-9 supervision materials
    url: https://www.nfa.futures.org/rulebook/rules.aspx
    note: >-
      Primary NFA rulebook entry point for member supervision requirements.
      The game does not imply that every rule directly governs every
      Northstar employee.
  - id: nfa_trade_records
    organization: National Futures Association
    title: NFA Compliance Rule 2-10 — Recordkeeping
    url: https://www.nfa.futures.org/rulebooksql/rules.aspx?RuleID=9029&Section=9
    note: >-
      Current NFA material incorporating applicable customer-order recordkeeping
      requirements. It supports the educational distinction among authorization,
      order, execution, confirmation, and reconciliation records. Northstar's
      fictional internal approval chain is not presented as an NFA requirement.
  - id: fasb_concepts_useful_information
    organization: Financial Accounting Standards Board
    title: Concepts Statement No. 8, Chapter 3 — Qualitative Characteristics
    url: https://storage.fasb.org/Concepts%20Statement%208%20Chapter%203%20As%20Amended.pdf
    note: >-
      Primary conceptual source for faithful representation, comparability,
      verifiability, and disclosure of assumptions supporting forward-looking
      information. It does not turn Northstar's fictional diligence schedules
      into GAAP financial statements.
  - id: sec_sab_99_materiality
    organization: U.S. Securities and Exchange Commission
    title: Staff Accounting Bulletin No. 99 — Materiality
    url: https://www.sec.gov/interps/account/sab99.htm
    note: >-
      Primary SEC staff guidance illustrating why quantitative thresholds alone
      are insufficient and surrounding qualitative circumstances matter.
      Northstar is fictional and private; the chapter uses the concept
      educationally and reaches no SEC, legal, or accounting-materiality conclusion.
  - id: fasb_debt_overview
    organization: Financial Accounting Standards Board
    title: FASB Accounting Standards Updates — Debt and Interest
    url: https://www.fasb.org/standards/accounting-standard-updates
    note: >-
      Primary standards entry point for debt and interest concepts. Northstar's
      available-liquidity covenant and headroom formula remain fictional contract terms.
