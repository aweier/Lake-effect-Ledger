core_chapters:
  - id: first_rotation
    title: First Rotation
    sequence: 1
    introduced_objective_ids:
      [physical_financial_exposure, short_futures_hedge, long_futures_hedge, basis_risk, hedge_ratio, daily_settlement_margin, liquidity_not_profit]
    practiced_objective_ids:
      [physical_financial_exposure, short_futures_hedge, long_futures_hedge, basis_risk, hedge_ratio, daily_settlement_margin, liquidity_not_profit]
    business_context_objective_ids:
      [hedge_documentation, economic_cash_accounting, reconciliation_evidence]
    estimated_minutes: 30
  - id: december_difference
    title: The December Difference
    sequence: 2
    introduced_objective_ids: []
    practiced_objective_ids: []
    business_context_objective_ids:
      [double_entry, classification_support, provisional_recognition, reconciliation_evidence, escalation_and_review, gas_imbalance]
    estimated_minutes: 12
    teaching_notes:
      - This chapter is accounting and business context. It does not materially increase Series 3 Core progress.
  - id: hedge_book
    title: The Hedge Book
    sequence: 3
    introduced_objective_ids: []
    practiced_objective_ids:
      [physical_financial_exposure, short_futures_hedge, basis_risk, hedge_ratio, daily_settlement_margin]
    business_context_objective_ids: [hedge_documentation, economic_cash_accounting]
    estimated_minutes: 25
    teaching_notes:
      - Use the position book to keep physical value, Henry Hub futures cash, Chicago basis, and FCM margin cash separate.
  - id: two_oclock_call
    title: The Two O'Clock Call
    sequence: 4
    introduced_objective_ids: []
    practiced_objective_ids: [daily_settlement_margin, liquidity_not_profit]
    business_context_objective_ids:
      [revolver_mechanics, obligation_priority, treasury_communication]
    estimated_minutes: 18
    teaching_notes:
      - Variation margin is daily futures cash. A later physical benefit cannot meet an earlier FCM deadline; operating cash and FCM cash are different locations.
  - id: eleventh_contract
    title: The Eleventh Contract
    sequence: 5
    introduced_objective_ids:
      [order_types, trade_lifecycle, trade_reconciliation, offset_preserves_history, authorization_vs_outcome, records_and_ethical_conduct]
    practiced_objective_ids:
      [short_futures_hedge, hedge_ratio, order_types, trade_lifecycle, trade_reconciliation, offset_preserves_history, authorization_vs_outcome, records_and_ethical_conduct]
    business_context_objective_ids: [gas_imbalance, reconciliation_evidence, treasury_communication]
    estimated_minutes: 35
    teaching_notes:
      - A market order prioritizes execution, a limit requires its price or better, and a stop activates only after its trigger. A $5.205 sell limit cannot fill below $5.205 in this simplified tape.
      - Authorization says what may happen; execution and confirmation say what did happen. Offset with a new opposite trade and preserve every earlier record.

